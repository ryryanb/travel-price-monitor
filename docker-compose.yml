services:
  localstack:
    image: localstack/localstack:4.4.0
    container_name: travel-price-monitor-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3,ses,apigateway,lambda,eventbridge,sqs
      - AWS_DEFAULT_REGION=ap-southeast-1
      - DEBUG=0
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack-data:
