services:
  localstack:
    image: localstack/localstack:2026.09.0
    container_name: travel-price-monitor-localstack
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN first}
      - SERVICES=dynamodb,s3,ses,apigateway,lambda,eventbridge,sqs,cognito-idp,ssm,cloudformation,iam
      - AWS_DEFAULT_REGION=ap-southeast-1
      - DEBUG=0
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack-data:
